%% ACL rules for FrigoCore EMQX broker
%% Format:
%%   {allow|deny, {user|clientid, "name"}, subscribe|publish, ["topic1", "topic2"]}.
%%
%% Rules are evaluated top-to-bottom; first match wins.

%% Allow firmware ESPs to publish telemetry under frigo/
{allow, {user, "firmware"}, publish, ["frigo/#"]}.

%% Allow backend to subscribe to all frigo/ topics
{allow, {user, "frigocore-backend"}, subscribe, ["frigo/#"]}.

%% Deny everything else
{deny, all}.