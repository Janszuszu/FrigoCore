# ============================================
# FrigoCore - Docker Compose
# ============================================

services:
  # ------------------------------------------
  # PostgreSQL - Primary Database
  # ------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: frigocore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: frigocore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: frigocore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frigocore"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - frigocore-network

  # ------------------------------------------
  # Redis - Cache & Message Broker
  # ------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: frigocore-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - frigocore-network

  # ------------------------------------------
  # EMQX - MQTT Broker for IoT
  # ------------------------------------------
  emqx:
    image: emqx/emqx:5.7.0
    container_name: frigocore-emqx
    restart: unless-stopped
    environment:
      EMQX_NAME: frigocore-emqx
      EMQX_HOST: 127.0.0.1
      EMQX_NODE__COOKIE: ${EMQX_NODE_COOKIE:?Set EMQX_NODE_COOKIE in .env}
      EMQX_CLUSTER__DISCOVERY_STRATEGY: static

      # Dashboard
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?Set EMQX_DASHBOARD_PASSWORD in .env}

      # --- File-based Authentication ---
      # auth.conf is rendered at startup by emqx-config-init from MQTT_* secrets
      # (never committed to git — see docker/emqx/render-auth-conf.sh)
      EMQX_AUTHN__1__BACKEND: file
      EMQX_AUTHN__1__FILE__PATH: /opt/emqx/etc-generated/auth.conf
      EMQX_AUTHN__1__MECHANISM: password_based
      EMQX_AUTHN__1__ENABLE: "true"

      # --- File-based Authorization (ACL) ---
      EMQX_AUTHORIZATION__SOURCES__1__TYPE: file
      EMQX_AUTHORIZATION__SOURCES__1__ENABLE: "true"
      EMQX_AUTHORIZATION__SOURCES__1__PATH: /opt/emqx/etc/acl.conf
      EMQX_AUTHORIZATION__NO_MATCH: deny
    ports:
      - "1883:1883"   # MQTT TCP
      - "8083:8083"   # MQTT WebSocket
      - "8084:8084"   # MQTT WebSocket SSL
      - "18083:18083" # Dashboard HTTP
    volumes:
      - ./docker/emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - emqx_auth_conf:/opt/emqx/etc-generated
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx_ctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      emqx-config-init:
        condition: service_completed_successfully
    networks:
      - frigocore-network

  # ------------------------------------------
  # EMQX config init - renders auth.conf from secrets at startup
  # (keeps MQTT credentials out of git; see docker/emqx/render-auth-conf.sh)
  # ------------------------------------------
  emqx-config-init:
    image: alpine:3.20
    container_name: frigocore-emqx-config-init
    environment:
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:?Set MQTT_BACKEND_PASSWORD in .env}
      MQTT_ESP_PASSWORD: ${MQTT_ESP_PASSWORD:?Set MQTT_ESP_PASSWORD in .env}
    volumes:
      - ./docker/emqx/render-auth-conf.sh:/render-auth-conf.sh:ro
      - emqx_auth_conf:/rendered
    command: ["/bin/sh", "/render-auth-conf.sh"]
    networks:
      - frigocore-network

  # ------------------------------------------
  # Backend - FastAPI Application
  # ------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: frigocore-backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://frigocore:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/frigocore
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
      EMQX_HOST: emqx
      EMQX_PORT: 1883
      MQTT_USER: frigocore-backend
      MQTT_PASSWORD: ${MQTT_BACKEND_PASSWORD:?Set MQTT_BACKEND_PASSWORD in .env}
      ENVIRONMENT: development
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_started
    networks:
      - frigocore-network

  # ------------------------------------------
  # Frontend - Vue 3 SPA
  # ------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: frigocore-frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_TARGET: http://backend:8000
      VITE_WS_TARGET: ws://backend:8000
    depends_on:
      - backend
    networks:
      - frigocore-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  emqx_data:
    driver: local
  emqx_log:
    driver: local
  emqx_auth_conf:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  frigocore-network:
    driver: bridge
    name: frigocore-network