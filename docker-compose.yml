# ============================================
# FrigoCore - Docker Compose
# ============================================

services:
  # ------------------------------------------
  # PostgreSQL - Primary Database
  # ------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: frigocore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: frigocore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: frigocore
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frigocore"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - frigocore-network

  # ------------------------------------------
  # Redis - Cache & Message Broker
  # ------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: frigocore-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - frigocore-network

  # ------------------------------------------
  # EMQX - MQTT Broker for IoT
  # ------------------------------------------
  emqx:
    image: emqx/emqx:5.7.0
    container_name: frigocore-emqx
    restart: unless-stopped
    environment:
      EMQX_NAME: frigocore-emqx
      EMQX_HOST: 127.0.0.1
      EMQX_NODE__COOKIE: ${EMQX_NODE_COOKIE:?Set EMQX_NODE_COOKIE in .env}
      EMQX_CLUSTER__DISCOVERY_STRATEGY: static

      # Dashboard
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?Set EMQX_DASHBOARD_PASSWORD in .env}

      # --- Authentication ---
      # 2026-08-08 fix: the previous block used EMQX_AUTHN__1__* (wrong env
      # prefix — root HOCON key is "authentication", so it was silently
      # ignored) AND backend=file + mechanism=password_based, which is not a
      # valid EMQX 5.7 authenticator combo at all (confirmed: crash-loops the
      # node with "unsupported_mechanism"). File-based user storage isn't a
      # supported password_based backend in EMQX 5.x — the only backends are
      # built_in_database, mysql, postgresql, mongodb, redis, http, jwt.
      # Using built_in_database instead: the authenticator itself is defined
      # here, and the actual user records are pushed in via the Management
      # API by the emqx-users-init service below (they persist in the
      # emqx_data volume across restarts, same as any other EMQX state).
      EMQX_AUTHENTICATION__1__MECHANISM: password_based
      EMQX_AUTHENTICATION__1__BACKEND: built_in_database
      EMQX_AUTHENTICATION__1__USER_ID_TYPE: username
      EMQX_AUTHENTICATION__1__PASSWORD_HASH_ALGORITHM__NAME: sha256
      EMQX_AUTHENTICATION__1__ENABLE: "true"

      # --- File-based Authorization (ACL) ---
      EMQX_AUTHORIZATION__SOURCES__1__TYPE: file
      EMQX_AUTHORIZATION__SOURCES__1__ENABLE: "true"
      EMQX_AUTHORIZATION__SOURCES__1__PATH: /opt/emqx/etc/acl.conf
      EMQX_AUTHORIZATION__NO_MATCH: deny
    ports:
      - "1883:1883"                # MQTT TCP — public: Orange Pi gateway connects over the Internet
      - "127.0.0.1:8083:8083"      # MQTT WebSocket — localhost only, tunnel via SSH if needed
      - "127.0.0.1:8084:8084"      # MQTT WebSocket SSL — localhost only
      - "127.0.0.1:18083:18083"    # Dashboard HTTP — localhost only, tunnel via SSH if needed
    volumes:
      - ./docker/emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx_ctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - frigocore-network

  # ------------------------------------------
  # EMQX users init - pushes MQTT user credentials into EMQX's built-in
  # database authenticator via the Management API, from secrets in .env.
  # Runs once EMQX is healthy; idempotent (creates or updates on every
  # deploy), so a fresh VPS needs no manual dashboard steps.
  # See docker/emqx/sync-users.sh.
  # ------------------------------------------
  emqx-users-init:
    image: curlimages/curl:8.10.1
    container_name: frigocore-emqx-users-init
    entrypoint: ["/bin/sh", "/sync-users.sh"]
    environment:
      EMQX_DASHBOARD_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?Set EMQX_DASHBOARD_PASSWORD in .env}
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:?Set MQTT_BACKEND_PASSWORD in .env}
      MQTT_ESP_PASSWORD: ${MQTT_ESP_PASSWORD:?Set MQTT_ESP_PASSWORD in .env}
      MQTT_DR154_01_PASSWORD: ${MQTT_DR154_01_PASSWORD:?Set MQTT_DR154_01_PASSWORD in .env}
      MQTT_ESP_TEST_PASSWORD: ${MQTT_ESP_TEST_PASSWORD:?Set MQTT_ESP_TEST_PASSWORD in .env}
      MQTT_OPI_KOTLETY_01_PASSWORD: ${MQTT_OPI_KOTLETY_01_PASSWORD:?Set MQTT_OPI_KOTLETY_01_PASSWORD in .env}
    volumes:
      - ./docker/emqx/sync-users.sh:/sync-users.sh:ro
    depends_on:
      emqx:
        condition: service_healthy
    networks:
      - frigocore-network

  # ------------------------------------------
  # Backend - FastAPI Application
  # ------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: frigocore-backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://frigocore:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/frigocore
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
      EMQX_HOST: emqx
      EMQX_PORT: 1883
      MQTT_USER: frigocore-backend
      MQTT_PASSWORD: ${MQTT_BACKEND_PASSWORD:?Set MQTT_BACKEND_PASSWORD in .env}
      ENVIRONMENT: production
      DEBUG: "false"
      # The SPA is served from the same origin as the API (Caddy proxies
      # /api and /ws to this container), so no cross-origin request is ever
      # made and no origin needs allowing. Never set this to "*".
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      # Path is fixed inside the container; the host-side file is bind
      # mounted below from FIREBASE_CREDENTIALS_HOST_PATH. Empty by default
      # so FCM sends fail clearly instead of pretending to deliver until the
      # host actually has a service-account key to mount.
      FIREBASE_CREDENTIALS_PATH: "${FIREBASE_CREDENTIALS_HOST_PATH:+/opt/FrigoCore/secrets/firebase-service-account.json}"
    volumes:
      - ${FIREBASE_CREDENTIALS_HOST_PATH:-/dev/null}:/opt/FrigoCore/secrets/firebase-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_started
    networks:
      - frigocore-network

  # ------------------------------------------
  # Frontend build - one-shot: compiles the Vue 3 SPA to a static
  # dist/ bundle into a shared volume. No dev server in production.
  # ------------------------------------------
  frontend-build:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: frigocore-frontend-build
    command: sh -c "npm run build"
    volumes:
      - frontend_dist:/app/dist
    networks:
      - frigocore-network

  # ------------------------------------------
  # Caddy - reverse proxy + static frontend host + automatic HTTPS
  # (Let's Encrypt) for frigocore.pl.
  # ------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: frigocore-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend-build:
        condition: service_completed_successfully
      backend:
        condition: service_started
    networks:
      - frigocore-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  emqx_data:
    driver: local
  emqx_log:
    driver: local
  frontend_dist:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  frigocore-network:
    driver: bridge
    name: frigocore-network