<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" width="720" height="640">
  <defs>
    <!-- faint engineering grid -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24,0 H0 V24" fill="none" stroke="#14233A" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="718" height="638" rx="16" fill="#0A1320" stroke="#22344E" stroke-width="2"/>
  <rect x="2" y="2" width="716" height="636" rx="15" fill="url(#grid)"/>

  <!-- palette: hot gas #E0705F, liquid #D6A94F, suction #4FA6D8, equipment #C3CEDD, fins #2F3F56 -->

  <!-- fins (behind the coils) -->
  <g stroke="#2F3F56" stroke-width="2">
    <path d="M112,392 V548 M126,392 V548 M140,392 V548 M154,392 V548 M168,392 V548 M182,392 V548 M196,392 V548 M210,392 V548 M224,392 V548 M238,392 V548"/>
    <path d="M482,392 V548 M496,392 V548 M510,392 V548 M524,392 V548 M538,392 V548 M552,392 V548 M566,392 V548 M580,392 V548 M594,392 V548 M608,392 V548"/>
  </g>

  <!-- piping: dark shell under a thinner coloured core, one weight everywhere -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#050A12" stroke-width="9">
      <path d="M290,128 H130 Q86,128 86,172 V384 Q86,400 104,400 H246 A23,23 0 0 1 246,446 H104 A23,23 0 0 0 104,492 H246 A23,23 0 0 1 246,538 H104 Q86,538 86,554 V576 Q86,600 110,600 H610 Q634,600 634,576 V554 Q634,538 616,538 H474 A23,23 0 0 1 474,492 H616 A23,23 0 0 0 616,446 H474 A23,23 0 0 1 474,400 H616 Q634,400 634,384 V172 Q634,128 590,128 H480"/>
    </g>
    <g stroke-width="4.5">
      <path d="M290,128 H130 Q86,128 86,172 V384 Q86,400 104,400 H246 A23,23 0 0 1 246,446 H104 A23,23 0 0 0 104,492 H246 A23,23 0 0 1 246,538" stroke="#E0705F"/>
      <path d="M246,538 H104 Q86,538 86,554 V576 Q86,600 110,600 H610 Q634,600 634,576 V554 Q634,538 616,538 H474" stroke="#D6A94F"/>
      <path d="M474,538 A23,23 0 0 1 474,492 H616 A23,23 0 0 0 616,446 H474 A23,23 0 0 1 474,400 H616 Q634,400 634,384 V172 Q634,128 590,128 H480" stroke="#4FA6D8"/>
    </g>
  </g>

  <!-- flow chevrons on the lines -->
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M196,121 l-8,7 l8,7" stroke="#E0705F"/>
    <path d="M79,262 l7,8 l7,-8" stroke="#E0705F"/>
    <path d="M354,593 l8,7 l-8,7" stroke="#D6A94F"/>
    <path d="M627,278 l7,-8 l7,8" stroke="#4FA6D8"/>
    <path d="M532,121 l-8,7 l8,7" stroke="#4FA6D8"/>
  </g>

  <!-- fan discs: neutral ring, thin outline symbol -->
  <g fill="#0A1320" stroke="#C3CEDD" stroke-width="2.5">
    <circle cx="175" cy="470" r="44"/>
    <circle cx="545" cy="470" r="44"/>
  </g>
  <g fill="none" stroke="#C3CEDD" stroke-width="1.2" stroke-opacity="0.35">
    <circle cx="175" cy="470" r="36"/>
    <circle cx="545" cy="470" r="36"/>
  </g>
  <!-- condenser: heat-out waves -->
  <g fill="none" stroke="#E0705F" stroke-width="3" stroke-linecap="round">
    <path d="M160,492 c-6,-8 6,-14 0,-22 c-6,-8 6,-14 0,-22"/>
    <path d="M175,494 c-6,-8 6,-14 0,-22 c-6,-8 6,-14 0,-22 c-4,-5 0,-9 0,-9"/>
    <path d="M190,492 c-6,-8 6,-14 0,-22 c-6,-8 6,-14 0,-22"/>
  </g>
  <!-- evaporator: snowflake, outline weight -->
  <g fill="none" stroke="#4FA6D8" stroke-width="3" stroke-linecap="round">
    <path d="M545,444 V496 M522,457 L568,483 M522,483 L568,457"/>
    <path d="M538,450 L545,456 L552,450 M538,490 L545,484 L552,490 M526,466 L534,465 L530,457 M564,474 L556,475 L560,483 M526,474 L534,475 L530,483 M564,466 L556,465 L560,457"/>
  </g>

  <!-- air: thin grey arrows through the coils -->
  <g fill="none" stroke="#5C6E87" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40,446 h20 m-6,-5 l6,5 l-6,5 M40,470 h20 m-6,-5 l6,5 l-6,5 M40,494 h20 m-6,-5 l6,5 l-6,5"/>
    <path d="M660,446 h20 m-6,-5 l6,5 l-6,5 M660,470 h20 m-6,-5 l6,5 l-6,5 M660,494 h20 m-6,-5 l6,5 l-6,5"/>
  </g>

  <!-- compressor: line art in equipment grey, a subtle lift -->
  <g fill="none" stroke="#C3CEDD" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" filter="url(#soft)">
    <path d="M343,92 V62 M387,92 V62 M336,62 H350 M380,62 H394"/>
    <path d="M315,118 Q315,90 365,88 Q415,90 415,118 V250 Q415,272 365,274 Q315,272 315,250 Z" fill="#0E1A2B"/>
    <path d="M315,122 Q365,140 415,122"/>
    <path d="M315,123 H302 M315,133 H302"/>
    <rect x="292" y="116" width="10" height="24" rx="2" fill="#0E1A2B"/>
    <rect x="320" y="134" width="10" height="72" rx="5"/>
    <path d="M338,268 L318,292 M392,268 L412,292"/>
    <rect x="298" y="290" width="34" height="8" rx="2"/>
    <rect x="398" y="290" width="34" height="8" rx="2"/>
    <rect x="430" y="168" width="30" height="74" rx="13" fill="#0E1A2B"/>
    <rect x="438" y="148" width="14" height="20"/>
    <rect x="434" y="155" width="22" height="7" rx="2"/>
    <path d="M440,148 V136 Q440,124 452,124 H470 M450,148 V140 Q450,134 456,134 H470"/>
    <rect x="470" y="116" width="10" height="24" rx="2" fill="#0E1A2B"/>
    <path d="M445,242 V258 H415 M445,258 V264"/>
    <rect x="415" y="196" width="15" height="10"/>
  </g>

  <!-- readings as instrument tags: dark plate, thin coloured edge and tick -->
  <g font-family="Barlow Semi Condensed, Arial Narrow, Arial, sans-serif" font-weight="600" font-size="30" fill="#E8EEF6" text-anchor="middle">
    <g>
      <rect x="140" y="44" width="116" height="44" rx="8" fill="#0E1A2B" stroke="#E0705F" stroke-opacity="0.55" stroke-width="1.5"/>
      <rect x="140" y="56" width="4" height="20" rx="2" fill="#E0705F"/>
      <text x="202" y="77">66,7°C</text>
    </g>
    <g>
      <rect x="470" y="44" width="104" height="44" rx="8" fill="#0E1A2B" stroke="#4FA6D8" stroke-opacity="0.55" stroke-width="1.5"/>
      <rect x="470" y="56" width="4" height="20" rx="2" fill="#4FA6D8"/>
      <text x="526" y="77">9,3°C</text>
    </g>
    <g>
      <rect x="307" y="314" width="116" height="44" rx="8" fill="#0E1A2B" stroke="#C3CEDD" stroke-opacity="0.45" stroke-width="1.5"/>
      <rect x="307" y="326" width="4" height="20" rx="2" fill="#E0705F"/>
      <text x="369" y="347">34,3°C</text>
    </g>
    <g>
      <rect x="302" y="532" width="116" height="44" rx="8" fill="#0E1A2B" stroke="#D6A94F" stroke-opacity="0.55" stroke-width="1.5"/>
      <rect x="302" y="544" width="4" height="20" rx="2" fill="#D6A94F"/>
      <text x="364" y="565">26,8°C</text>
    </g>
  </g>
</svg>
